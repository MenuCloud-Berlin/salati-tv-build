name: tvOS Release IPA

# Baut die signierte Apple-TV-App auf einem macOS-Runner und laedt sie direkt zu
# App Store Connect. Derselbe Weg wie bei der Handy-App (apps/mobile,
# .github/workflows/ios.yml) — deshalb stehen hier dieselben Xcode-26-Korrekturen
# an Expo SDK 57.
#
# Signierung kommt ausschliesslich aus verschluesselten Actions-Secrets:
#   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD   Verteilungszertifikat
#   IOS_PROFILE_TV                                tvOS-App-Store-Profil
#   IOS_KEYCHAIN_PASSWORD                         beliebig, nur fuer die Keychain
#   ASC_KEY_P8_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID  App-Store-Connect-Schluessel
# Angelegt von apps/tv/scripts/asc-signierung.mjs.

on:
  workflow_dispatch:
    inputs:
      buildNummer:
        description: 'CFBundleVersion (muss hoeher sein als jeder schon hochgeladene Build)'
        required: true
        default: '1'
      hochladen:
        description: 'IPA zu App Store Connect laden'
        type: boolean
        default: true

env:
  EXPO_TV: '1'
  TEAM_ID: ZKG548NGDR
  BUNDLE_ID: de.salatibox.tv
  PROFIL_NAME: Salati TV AppStore

jobs:
  build-tvos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm installieren
        run: npm install -g pnpm@10.33.0

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      # Build-Nummer setzen. Apple lehnt eine bereits hochgeladene
      # CFBundleVersion ab, auch wenn die Versionsnummer dieselbe bleibt —
      # deshalb kommt sie von aussen und nicht aus der committeten Konfiguration.
      - name: Build-Nummer eintragen
        env:
          NUMMER: ${{ inputs.buildNummer }}
        run: |
          set -e
          perl -i -pe "s/buildNumber: '[^']*'/buildNumber: '\$ENV{NUMMER}'/" app.config.js
          grep -n "buildNumber" app.config.js | grep -q "'${NUMMER}'"
          grep -n "buildNumber" app.config.js

      # Swift 6.2 (Xcode 26) lehnt `weak let` als Fehler ab. In Expo-Modulen
      # stehen diese Deklarationen in `Sendable`-Klassen — aus `weak var` wird
      # dort der naechste Fehler. `nonisolated(unsafe)` ist die dafuer
      # vorgesehene Zusicherung. Hergang: apps/mobile/.github/workflows/ios.yml.
      - name: Swift-6.2-Fix weak-let in Expo-Modulen
        run: |
          cnt=0
          while IFS= read -r f; do
            perl -i -pe 's/\bweak let /nonisolated(unsafe) weak var /g' "$f"
            cnt=$((cnt+1))
          done < <(grep -rl "weak let " node_modules --include="*.swift" 2>/dev/null)
          echo "weak-let -> nonisolated(unsafe) weak var in $cnt Swift-Dateien gepatcht"

      # `abs()` ist in JavaScriptCodable+Date.swift mehrdeutig, seit die Datei
      # C++-Interop hereinzieht (dort liegt auch das C-`abs`). `Swift.abs`
      # benennt die gemeinte Ueberladung.
      - name: Swift-6.2-Fix mehrdeutiges abs() in expo-modules-jsi
        run: |
          cnt=0
          while IFS= read -r f; do
            perl -i -pe 's/(?<![.\w])abs\(milliseconds\)/Swift.abs(milliseconds)/g' "$f"
            cnt=$((cnt+1))
          done < <(grep -rl "abs(milliseconds)" node_modules --include="*.swift" 2>/dev/null)
          echo "abs() eindeutig gemacht in $cnt Swift-Dateien"

      - name: Xcode 26 waehlen (Expo SDK 57 verlangt swift-tools 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app \
            || sudo xcode-select -s /Applications/Xcode_26.1.app \
            || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: expo prebuild (tvOS-Projekt erzeugen)
        run: npx expo prebuild -p ios --no-install

      # Nachweisen, dass wirklich ein tvOS-Projekt entstanden ist und nicht ein
      # iPhone-Projekt. Ohne diese Zeilen baut alles gruen durch und Apple lehnt
      # erst die fertige Einreichung ab.
      - name: Nachweis — tvOS-Ziel und Marken-Grafiken
        working-directory: ios
        run: |
          set -e
          PROJ=$(ls -d *.xcodeproj | head -1)
          grep -q 'SDKROOT = appletvos' "$PROJ/project.pbxproj" || { echo "::error::SDKROOT ist nicht appletvos"; exit 1; }
          grep -q 'TARGETED_DEVICE_FAMILY = 3' "$PROJ/project.pbxproj" || { echo "::error::TARGETED_DEVICE_FAMILY ist nicht 3 (Apple TV)"; exit 1; }
          NAME=$(basename "$PROJ" .xcodeproj)
          find "$NAME/Images.xcassets/TVAppIcon.brandassets" -maxdepth 1 -mindepth 1 | sort
          test -d "$NAME/Images.xcassets/TVAppIcon.brandassets/App Icon - Large.imagestack"
          test -d "$NAME/Images.xcassets/TVAppIcon.brandassets/Top Shelf Image.imageset"
          echo "PROJEKT=$NAME" >> "$GITHUB_ENV"

      - name: CocoaPods installieren
        working-directory: ios
        run: pod install --repo-update

      - name: Signierung einrichten (Keychain + Zertifikat + Profil)
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PROFIL: ${{ secrets.IOS_PROFILE_TV }}
        run: |
          set -e
          KC="$RUNNER_TEMP/salati-tv.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KC"
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          echo "$PROFIL" | base64 -d > "$PROF_DIR/salati-tv.mobileprovision"
          security find-identity -v -p codesigning "$KC"

      - name: exportOptions.plist schreiben
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFIL_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          cat "$RUNNER_TEMP/exportOptions.plist"

      - name: ASC-Schluessel ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8"

      # Unsigniert archivieren, signiert exportieren — sonst greift Xcodes
      # Auto-Signing und verlangt ein Entwicklungsprofil mit registrierten
      # Geraeten.
      - name: Archiv bauen (xcodebuild archive, tvOS, unsigniert)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "${PROJEKT}.xcworkspace" \
            -scheme "${PROJEKT}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SalatiTV.xcarchive" \
            -destination "generic/platform=tvOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=${TEAM_ID} \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: IPA exportieren
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SalatiTV.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: IPA direkt zu App Store Connect laden
        if: ${{ inputs.hochladen }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "Lade hoch: $IPA ($(du -h "$IPA" | cut -f1))"
          mkdir -p "$HOME/private_keys"
          cp "$RUNNER_TEMP/asc.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t appletvos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: IPA als Artefakt (Rueckfallebene)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: salati-tv-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 5
