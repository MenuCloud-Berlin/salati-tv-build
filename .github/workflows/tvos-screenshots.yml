name: tvOS Screenshots

# Nimmt die App-Store-Bilder im Apple-TV-Simulator auf. Sie muessen aus der
# tvOS-App kommen: Bilder aus dem Android-Emulator zeigen zwar dieselben
# Bildschirme, aber nicht die Plattform, fuer die sie verkauft werden.
#
# Gebaut wird fuer den Simulator (unsigniert) — kein Zertifikat noetig.

on:
  workflow_dispatch:
    inputs:
      sprachen:
        description: 'Sprachen, durch Leerzeichen getrennt (z. B. "de en")'
        required: true
        default: 'de en'

env:
  EXPO_TV: '1'

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm installieren
        run: npm install -g pnpm@10.33.0

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      # Begruendung s. .github/workflows/tvos.yml.
      - name: WeakLet fuer expo-modules-jsi einschalten
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const datei = "node_modules/expo-modules-jsi/apple/Package.swift";
            const anker = ".enableUpcomingFeature(\"InferIsolatedConformances\"),";
            const neu = "\n        .enableUpcomingFeature(\"WeakLet\"),";
            let s = fs.readFileSync(datei, "utf8");
            if (s.includes("enableUpcomingFeature(\"WeakLet\")")) { console.log("schon da"); process.exit(0); }
            if (!s.includes(anker)) { console.error("::error::Anker fehlt in " + datei); process.exit(1); }
            fs.writeFileSync(datei, s.replace(anker, anker + neu));
            console.log("WeakLet eingetragen");
          '
          grep -n "WeakLet" node_modules/expo-modules-jsi/apple/Package.swift

      - name: Swift-6.2-Fix mehrdeutiges abs() in expo-modules-jsi
        run: |
          while IFS= read -r f; do
            perl -i -pe 's/(?<![.\w])abs\(milliseconds\)/Swift.abs(milliseconds)/g' "$f"
          done < <(grep -rl "abs(milliseconds)" node_modules --include="*.swift" 2>/dev/null)

      - name: Xcode 26 waehlen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app \
            || sudo xcode-select -s /Applications/Xcode_26.1.app \
            || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      # Bedingungslos und mit drei Anlaeufen: eine Vorabpruefung meldet
      # faelschlich „vorhanden", und der Download bricht gelegentlich mit
      # „Unable to connect to simulator" ab (Begruendung in tvos.yml).
      - name: tvOS-Plattform sicherstellen
        run: |
          set -e
          ok=0
          for versuch in 1 2 3; do
            if sudo xcodebuild -downloadPlatform tvOS; then ok=1; break; fi
            echo "Anlauf $versuch fehlgeschlagen — neuer Versuch in 30 s"
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::tvOS-Plattform liess sich nicht laden."; exit 1; }
          xcrun simctl list runtimes | grep -i tvos || true

      - name: expo prebuild
        run: npx expo prebuild -p ios --no-install

      - name: CocoaPods installieren
        working-directory: ios
        run: pod install --repo-update

      - name: Fuer den Simulator bauen
        working-directory: ios
        run: |
          set -o pipefail
          PROJ=$(ls -d *.xcodeproj | head -1)
          NAME=$(basename "$PROJ" .xcodeproj)
          echo "PROJEKT=$NAME" >> "$GITHUB_ENV"
          xcodebuild build \
            -workspace "${NAME}.xcworkspace" \
            -scheme "${NAME}" \
            -configuration Release \
            -sdk appletvsimulator \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Bilder aufnehmen
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-appletvsimulator/*.app | head -1)
          bash scripts/tvos-screenshots.sh "$APP" ${{ inputs.sprachen }}

      - uses: actions/upload-artifact@v4
        with:
          name: tvos-screenshots
          path: screenshots/appletv/**
          if-no-files-found: error
          retention-days: 7
