name: Android TV APK

# Baut die signierte Android-TV-App auf einem Linux-Runner. Gebraucht wird sie
# fuer zweierlei: die Bildschirmfotos der Play-Store-Seite (die muessen aus der
# ANDROID-Fassung kommen, nicht aus dem Apple-TV-Simulator) und als freier
# Ersatz fuer den EAS-Build.
#
# Signierung ueber Actions-Secrets; plugins/with-release-signing.js bricht einen
# Release-Build ohne echten Upload-Keystore bewusst ab, statt still mit dem
# Debug-Schluessel zu signieren.

on:
  workflow_dispatch:
    inputs:
      art:
        description: 'apk (Emulator, Direktdownload) oder aab (Play)'
        type: choice
        options: [apk, aab]
        default: apk

env:
  EXPO_TV: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: pnpm installieren
        run: npm install -g pnpm@10.33.0

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      - name: expo prebuild (Android-Projekt erzeugen)
        run: npx expo prebuild -p android --no-install

      - name: Keystore und Passwoerter ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TV_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TV_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TV_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p "$HOME/.gradle"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/upload-keystore.jks"
          {
            echo "TV_RELEASE_STORE_FILE=$HOME/upload-keystore.jks"
            echo "TV_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TV_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "TV_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          keytool -list -keystore "$HOME/upload-keystore.jks" -storepass "$STORE_PASSWORD" | grep -i "SHA1\|SHA-1" || true

      - name: Bauen
        working-directory: android
        run: |
          set -e
          if [ "${{ inputs.art }}" = "aab" ]; then
            ./gradlew :app:bundleRelease --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      # Nachweisen, dass die Datei wirklich ARM UND x86_64 enthaelt: die
      # Android-TV-Emulatoren sind x86_64, und eine reine ARM-Datei laesst sich
      # dort nicht installieren.
      - name: Nachweis — Architekturen im Paket
        run: |
          set -e
          DATEI=$(ls android/app/build/outputs/*/release/*.a[ap][bk] | head -1)
          echo "Datei: $DATEI ($(du -h "$DATEI" | cut -f1))"
          unzip -l "$DATEI" | grep -oE "(lib/|base/lib/)[a-z0-9_-]+/" | sort -u

      # Veroeffentlichen, sobald ein AAB gebaut wurde. Derselbe Weg wie bei der
      # Handy-App (apps/mobile/scripts/ci-release-upload.mjs, hier als Kopie) -
      # nur mit anderem Paketnamen. Ein Dienstkonto des Entwicklerkontos hat
      # Zugriff auf ALLE seine Apps, es braucht also keinen zweiten Zugang.
      #
      # Fehlt das Geheimnis, wird der Schritt still uebersprungen und das AAB
      # bleibt als Artefakt zum Hochladen von Hand. Genau so war es bis heute:
      # der Fernseher hatte gar keinen Veroeffentlichungsschritt.
      - name: AAB in den Play Store (Produktions-Track)
        if: inputs.art == 'aab'
        env:
          PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_BASE64" ]; then
            echo "PLAY_SERVICE_ACCOUNT_BASE64 fehlt - Veroeffentlichung uebersprungen."
            echo "Das AAB haengt als Artefakt am Lauf."
            exit 0
          fi
          # app.config.js exportiert das Expo-Objekt DIREKT, nicht unter .expo -
          # anders als app.config.ts der Handy-App.
          VERSION=$(node -e "console.log(require('./app.config.js').version)")
          # Hausform des Fernsehers: release-notes-<version>.json
          NOTES="store/release-notes-$VERSION.json"
          echo "Version $VERSION, Notizen: $NOTES"
          test -f "$NOTES"
          node scripts/ci-release-upload.mjs             --package de.salatibox.tv             --aab android/app/build/outputs/bundle/release/app-release.aab             --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: salati-tv-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
